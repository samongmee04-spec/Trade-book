<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e7ea"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>สมุดเทรด</title>
<style>
:root{--bg:#e4e7ea;--tx:#3a3d42;--mu:#8b9096;--hi:#fff;--lo:#c6cace;--gain:#2db3cf;--loss:#e5241d;--yel:#f5c75a;--lime:#e8edb2;--cy:#7ad9ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2b2e33;--tx:#e6e8eb;--mu:#9a9fa6;--hi:#35393f;--lo:#212428}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2b2e33;--tx:#e6e8eb;--mu:#9a9fa6;--hi:#35393f;--lo:#212428}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:18px 18px 60px}
.raise{background:var(--bg);box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi);border-radius:24px}
.press{background:var(--bg);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);border-radius:16px}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mon{display:flex;align-items:center;gap:6px;font-size:17px}
.mon button{width:34px;height:34px;border-radius:50%;box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);color:var(--mu)}
.mon span{min-width:112px;text-align:center}
.pill{display:flex;padding:3px;border-radius:20px}
.pill button{padding:6px 12px;border-radius:17px;font-size:13px;color:var(--mu);background:transparent}
.pill button.on{background:var(--bg);color:var(--tx);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi)}
.hero{display:flex;align-items:center;justify-content:center;flex-direction:column;width:215px;height:215px;border-radius:50%;margin:6px auto 22px;text-align:center}
.hero small{color:var(--mu);font-size:13px}
.hero b{font-size:27px;font-weight:600;margin:4px 0}
.hero i{font-style:normal;font-size:14px}
.up{color:var(--gain)}.dn{color:var(--loss)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.chip{padding:12px 6px;text-align:center;border-radius:18px}
.chip small{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
.chip b{font-size:14px;font-weight:600}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:16px;color:var(--mu);font-size:14px}
.tabs button.on{color:var(--tx);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.card{padding:16px;margin-bottom:20px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--mu)}
.f{display:flex;flex-direction:column;gap:10px}
.f input,.f textarea{padding:12px 14px;border-radius:14px;width:100%;box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);background:var(--bg)}
.f textarea{resize:none;height:44px}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:11px;border-radius:14px;color:var(--mu);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi)}
.seg button.g.on{color:#fff;background:var(--gain);box-shadow:none}
.seg button.l.on{color:#fff;background:var(--loss);box-shadow:none}
.go{padding:13px;border-radius:50px;background:var(--blue)!important;color:#fff;font-weight:500;box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
.sm{font-size:12px;color:var(--mu);background:transparent;padding:6px}
.err{color:var(--loss);font-size:13px;min-height:16px}
.day{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:12px 14px;margin-bottom:12px;border-radius:18px;width:100%;text-align:left}
.day .d{color:var(--mu);font-size:13px}
.day .n{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .r{text-align:right}.day .r b{display:block;font-size:15px;font-weight:600}.day .r small{color:var(--mu);font-size:11px}
.empty{text-align:center;color:var(--mu);padding:26px 0;font-size:14px}
.mrow{padding:16px;margin-bottom:14px;border-radius:20px}
.mrow .h{display:flex;justify-content:space-between;margin-bottom:8px}
.mrow .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--mu)}
.mrow .g b{color:var(--tx);font-weight:500}
svg{display:block;width:100%}
.sync{text-align:center;font-size:11px;color:var(--mu);margin-top:26px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mu);margin-right:5px}
.dot.ok{background:var(--gain)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tools button{padding:9px 14px;border-radius:14px;font-size:12px;box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi)}
.hide{display:none}
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;padding:24px;text-align:center}
#login.hide{display:none}
#login .go{padding:14px 28px}

.go{background:var(--yel)!important;color:#3a3d42!important}
#cT.on{background:var(--yel);color:#3a3d42}
#cU.on{background:var(--cy);color:#3a3d42}
.hero{color:#3a3d42}.hero small{color:#5b5f66}.hero i{font-weight:500}
.hero.thb{background:linear-gradient(145deg,#f9da85,#f2bd3e)}
.hero.usd{background:linear-gradient(145deg,#9fe6f4,#62cfe6)}
.chip{color:#3a3d42}.chip small{color:#6b7076}
.chip.c1{background:var(--lime)}.chip.c2{background:#b8ebf5}.chip.c3{background:#f9e4a6}
.tabs button.on{color:#3a3d42;box-shadow:none}
#t1.on{background:var(--yel)}#t2.on{background:var(--lime)}#t3.on{background:var(--cy)}
.card h3{color:var(--tx);font-weight:500}
.card h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c,var(--yel))}
.dg{padding:14px;margin-bottom:14px;border-radius:20px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dh small{color:var(--mu);font-size:12px;margin-left:8px}.dh b{font-size:15px}
.tr{display:grid;grid-template-columns:20px 1fr auto 30px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--lo);font-size:13px}
.tr .no{color:var(--mu);font-size:11px}.tr .n{color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tr .del{width:30px;height:30px;border-radius:50%;padding:0;color:var(--mu);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 4px var(--lo),-2px -2px 4px var(--hi)}
.del svg{width:14px;height:14px}
.dsum{font-size:13px;color:var(--mu);min-height:18px}
</style>
</head>
<body>
<div id="login" class="hide"><div style="font-size:42px">📒</div><div>สมุดเทรด</div><button class="go" id="lb">เข้าสู่ระบบด้วย Google</button><div class="err" id="lmsg"></div></div>
<div class="app">
  <div class="top">
    <div class="mon"><button id="pm">‹</button><span id="mt"></span><button id="nm">›</button></div>
    <div class="pill press"><button id="cT">฿</button><button id="cU">$</button></div>
  </div>

  <div class="hero raise thb" id="hero"><small>ยอดสะสมรวม</small><b id="total"></b><i id="mpl"></i></div>

  <div class="row3">
    <div class="chip raise c1"><small>วัน / ครั้ง</small><b id="sDays">0</b></div>
    <div class="chip raise c2"><small>วันชนะ</small><b id="sWin">–</b></div>
    <div class="chip raise c3"><small>ต้นเดือน</small><b id="sStart"></b></div>
  </div>

  <div class="tabs">
    <button id="t1" class="on">บันทึก</button>
    <button id="t2">สรุปเดือน</button>
    <button id="t3">ตั้งค่า</button>
  </div>

  <section id="p1">
    <div class="card raise" style="--c:#f5c75a">
      <h3 id="fh">บันทึกการเทรด</h3>
      <div class="f">
        <input type="date" id="fd"><div class="dsum" id="ds"></div>
        <div class="seg"><button class="g on" id="bg">กำไร</button><button class="l" id="bl">ขาดทุน</button></div>
        <input type="number" id="fa" inputmode="decimal" step="any" min="0" placeholder="จำนวนเงิน">
        <textarea id="fn" placeholder="โน้ต (อารมณ์ / กลยุทธ์)"></textarea>
        <div class="err" id="fe"></div>
        <button class="go" id="fs">เพิ่มรายการ</button>
        
      </div>
    </div>
    <div class="card raise" style="--c:#7ad9ec"><h3>ยอดสะสม</h3><div id="chart"></div></div>
    <div id="list"></div>
  </section>

  <section id="p2" class="hide"><div id="months"></div></section>

  <section id="p3" class="hide">
    <div class="card raise" style="--c:#cfd97a">
      <h3>ตั้งค่า</h3>
      <div class="f">
        <label class="sm" style="text-align:left">เงินทุนเริ่มต้น (USD)</label>
        <input type="number" id="sc" inputmode="decimal" step="any">
        <label class="sm" style="text-align:left">อัตราแลกเปลี่ยน (฿ ต่อ 1 $)</label>
        <input type="number" id="sr" inputmode="decimal" step="any">
        <button class="go" id="ss">บันทึกการตั้งค่า</button>
      </div>
    </div>
    <div class="card raise" style="--c:#e5241d">
      <h3>สำรองข้อมูล</h3>
      <div class="tools">
        <button id="eJ">JSON</button><button id="eC">CSV</button><button id="iJ">นำเข้า</button><button id="lo">ออกจากระบบ</button>
        <input type="file" id="fi" accept=".json,application/json" class="hide">
      </div>
      <div class="err" id="te" style="text-align:center;margin-top:8px"></div>
    </div>
  </section>

  <div class="sync"><span class="dot" id="dot"></span><span id="st">เก็บในเครื่อง</span></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ===== วางค่า firebaseConfig ของคุณตรงนี้ (ดูขั้นตอนที่ 3 ในคู่มือ) =====
const firebaseConfig = {
  apiKey: "AIzaSyAXQdJnw8mbwvFkz4VzTnmBi6NMCAQbaW8",
  authDomain: "trade-book-5eb48.firebaseapp.com",
  projectId: "trade-book-5eb48",
  storageBucket: "trade-book-5eb48.firebasestorage.app",
  messagingSenderId: "1052896975196",
  appId: "1:1052896975196:web:c58efc85e3e2fbcdd94999"
};
// =====================================================================

var MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var $=function(s){return document.querySelector(s)};
var S={cap:1000,rate:35,days:[]},cur='THB',sign=1,dbDoc=null,synced=false;
var now=new Date(),ym=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);

try{var l=JSON.parse(localStorage.getItem('tj')||'null');if(l&&l.days)S=l;cur=localStorage.getItem('tjc')||'THB'}catch(e){}

function money(u,sg){var v=cur==='USD'?u:u*S.rate,s=(cur==='USD'?'$':'฿'),a=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?'−':(sg&&v>0?'+':''))+s+a}
function cls(v){return v>0?'up':v<0?'dn':''}
function rows(){var d=S.days.slice().sort(function(a,b){return a.d<b.d?-1:1}),b=S.cap;return d.map(function(x){b+=x.p;return{i:x.i,d:x.d,p:x.p,n:x.n||'',b:b}})}
function save(){ensure();try{localStorage.setItem('tj',JSON.stringify(S))}catch(e){}
  if(dbDoc)setDoc(dbDoc,JSON.parse(JSON.stringify(S))).catch(function(){setSt(false)})}
function setSt(ok){synced=ok;$('#dot').className='dot'+(ok?' ok':'');$('#st').textContent=ok?'ซิงก์ทุกอุปกรณ์แล้ว':'เก็บในเครื่อง'}
function isWk(s){var g=new Date(s+'T12:00:00').getDay();return g>0&&g<6}
function lastWk(){var d=new Date();while(d.getDay()==0||d.getDay()==6)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

var TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';
function nid(){return 't'+Math.random().toString(36).slice(2,9)}
function ensure(){S.days.forEach(function(x){if(!x.i)x.i=nid()})}
function groups(a){var g=[];a.forEach(function(r){var l=g[g.length-1];if(!l||l.d!==r.d){l={d:r.d,items:[],net:0,b:0};g.push(l)}l.items.push(r);l.net+=r.p;l.b=r.b});return g}
function render(){ensure();
  var R=rows(),mr=R.filter(function(r){return r.d.slice(0,7)===ym});
  var before=R.filter(function(r){return r.d.slice(0,7)<ym});
  var start=before.length?before[before.length-1].b:S.cap;
  var net=mr.reduce(function(a,r){return a+r.p},0),end=start+net,total=R.length?R[R.length-1].b:S.cap;
  var dg=groups(mr),w=dg.filter(function(g){return g.net>0}).length;$('#hero').className='hero raise '+(cur==='THB'?'thb':'usd');
  $('#mt').textContent=MN[+ym.slice(5)-1]+' '+ym.slice(0,4);
  $('#cT').className=cur==='THB'?'on':'';$('#cU').className=cur==='USD'?'on':'';
  $('#total').textContent=money(total);
  $('#mpl').textContent=money(net,1);$('#mpl').className=cls(net);
  $('#sDays').textContent=dg.length+' / '+mr.length;
  $('#sWin').textContent=dg.length?Math.round(w/dg.length*100)+'%':'–';
  $('#sStart').textContent=money(start);
  var h='';dg.slice().reverse().forEach(function(g){
    h+='<div class="dg raise"><div class="dh"><span>'+(+g.d.slice(8))+' '+MN[+g.d.slice(5,7)-1]+'<small>'+g.items.length+' ครั้ง · คงเหลือ '+money(g.b)+'</small></span><b class="'+cls(g.net)+'">'+money(g.net,1)+'</b></div>'+
    g.items.map(function(r,k){return '<div class="tr"><span class="no">'+(k+1)+'</span><span class="n">'+esc(r.n)+'</span><b class="'+cls(r.p)+'">'+money(r.p,1)+'</b><button class="del" data-i="'+r.i+'" aria-label="ลบ">'+TRASH+'</button></div>'}).join('')+'</div>'});
  $('#list').innerHTML=h||'<div class="empty">ยังไม่มีบันทึกเดือนนี้</div>';
  chart(dg,start);
  months(R);
  $('#sc').value=cur==='USD'?S.cap:+(S.cap*S.rate).toFixed(2);
  $('#sr').value=S.rate;if($('#fd').value)fill($('#fd').value);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function chart(mr,start){
  if(mr.length<2){$('#chart').innerHTML='<div class="empty">บันทึกอย่างน้อย 2 วันเพื่อดูกราฟ</div>';return}
  var pts=[start].concat(mr.map(function(r){return r.b})),W=320,H=130,P=8,
  mn=Math.min.apply(0,pts),mx=Math.max.apply(0,pts),rg=(mx-mn)||1;
  var xy=pts.map(function(v,i){return[P+i*(W-2*P)/(pts.length-1),H-P-(v-mn)/rg*(H-2*P)]});
  var d=xy.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  var up=pts[pts.length-1]>=pts[0],c=up?'#2db3cf':'#e5241d',l=xy[xy.length-1];
  $('#chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'"><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="5" fill="'+c+'"/></svg>';
}

function months(R){
  var g={};R.forEach(function(r){var k=r.d.slice(0,7);(g[k]=g[k]||[]).push(r)});
  var ks=Object.keys(g).sort(),p=S.cap,st={},h='';
  ks.forEach(function(k){st[k]=p;p=g[k][g[k].length-1].b});
  ks.reverse().forEach(function(k){var a=g[k],s0=st[k],e=a[a.length-1].b,net=e-s0,dg=groups(a),w=dg.filter(function(x){return x.net>0}).length,
    best=Math.max.apply(0,dg.map(function(x){return x.net})),worst=Math.min.apply(0,dg.map(function(x){return x.net}));
    h+='<div class="mrow raise" style="border-left:6px solid '+(net>=0?'#7ad9ec':'#e5241d')+'"><div class="h"><span>'+MN[+k.slice(5)-1]+' '+k.slice(0,4)+'</span><b class="'+cls(net)+'">'+money(net,1)+' · '+(s0?(net/s0*100).toFixed(1):'0')+'%</b></div><div class="g">'+
    '<span>วัน / ครั้ง <b>'+dg.length+' / '+a.length+'</b></span><span>ชนะ/แพ้ (วัน) <b>'+w+'/'+(dg.length-w)+'</b></span>'+
    '<span>วันดีสุด <b class="up">'+money(best,1)+'</b></span><span>วันแย่สุด <b class="dn">'+money(worst,1)+'</b></span>'+
    '<span>ต้นเดือน <b>'+money(s0)+'</b></span><span>สิ้นเดือน <b>'+money(e)+'</b></span></div></div>'});
  $('#months').innerHTML=h||'<div class="empty">ยังไม่มีข้อมูล</div>';
}

function tab(n){[1,2,3].forEach(function(i){$('#p'+i).className=i===n?'':'hide';$('#t'+i).className=i===n?'on':''})}
function fill(d){$('#fd').value=d;var a=rows().filter(function(r){return r.d===d}),n=a.reduce(function(t,r){return t+r.p},0);
  $('#ds').innerHTML=a.length?('วันที่เลือก: '+a.length+' ครั้ง · <b class="'+cls(n)+'">'+money(n,1)+'</b>'):'ยังไม่มีรายการในวันที่เลือก'}
function setSign(){$('#bg').className='g'+(sign>0?' on':'');$('#bl').className='l'+(sign<0?' on':'')}

$('#pm').onclick=function(){var y=+ym.slice(0,4),m=+ym.slice(5)-1;m--;if(m<0){m=11;y--}ym=y+'-'+('0'+(m+1)).slice(-2);render()};
$('#nm').onclick=function(){var y=+ym.slice(0,4),m=+ym.slice(5)-1;m++;if(m>11){m=0;y++}ym=y+'-'+('0'+(m+1)).slice(-2);render()};
$('#cT').onclick=function(){cur='THB';try{localStorage.setItem('tjc',cur)}catch(e){}render()};
$('#cU').onclick=function(){cur='USD';try{localStorage.setItem('tjc',cur)}catch(e){}render()};
$('#t1').onclick=function(){tab(1)};$('#t2').onclick=function(){tab(2)};$('#t3').onclick=function(){tab(3)};
$('#bg').onclick=function(){sign=1;setSign()};$('#bl').onclick=function(){sign=-1;setSign()};
$('#fd').onchange=function(){fill($('#fd').value)};
$('#list').onclick=function(e){var b=e.target.closest('.del');if(b&&confirm('ลบรายการนี้?')){S.days=S.days.filter(function(x){return x.i!==b.dataset.i});save();render()}};
$('#fs').onclick=function(){
  var d=$('#fd').value,a=parseFloat($('#fa').value);$('#fe').textContent='';
  if(!d){$('#fe').textContent='เลือกวันที่';return}
  if(!isWk(d)){$('#fe').textContent='เลือกวันจันทร์–ศุกร์เท่านั้น';return}
  if(isNaN(a)){$('#fe').textContent='ใส่จำนวนเงิน';return}
  var usd=sign*Math.abs(cur==='USD'?a:a/S.rate);
  S.days.push({i:nid(),d:d,p:Math.round(usd*100)/100,n:$('#fn').value.trim()});
  ym=d.slice(0,7);$('#fa').value='';$('#fn').value='';save();render()};
$('#ss').onclick=function(){var c=parseFloat($('#sc').value),r=parseFloat($('#sr').value);
  if(!(r>0)||isNaN(c))return;S.rate=r;S.cap=cur==='USD'?c:c/r;save();render();tab(1)};

function dl(name,data){
  var u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})),l=document.createElement('a');
  l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);$('#te').textContent=''}
$('#eJ').onclick=function(){dl('trading-journal.json',JSON.stringify(S,null,1))};
$('#eC').onclick=function(){var c='date,pl_usd,balance_usd,note\n'+rows().map(function(r){return[r.d,r.p,r.b.toFixed(2),'"'+r.n.replace(/"/g,'""')+'"'].join(',')}).join('\n');dl('trading-journal.csv','\ufeff'+c)};
$('#iJ').onclick=function(){$('#fi').click()};
$('#fi').onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j.days||!j.rate)throw 0;S=j;save();render();$('#te').textContent='นำเข้าแล้ว'}catch(x){$('#te').textContent='ไฟล์ไม่ถูกต้อง'}};rd.readAsText(f)};

fill(lastWk());render();

// Firebase: ล็อกอิน Google + ซิงก์ real-time (ข้อมูลเป็นของบัญชีคุณคนเดียว)
var lg=$('#login');
if(firebaseConfig.apiKey.indexOf('PASTE')>-1){lg.className='';$('#lb').className='hide';$('#lmsg').textContent='ยังไม่ได้ใส่ค่า firebaseConfig ในไฟล์'}
else try{
  var app=initializeApp(firebaseConfig),auth=getAuth(app),
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}),unsub=null;
  $('#lb').onclick=function(){var p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});$('#lmsg').textContent='';signInWithPopup(auth,p).catch(function(e){var c=(e&&e.code)||'error';
    if(c==='auth/popup-blocked'){signInWithRedirect(auth,p);return}
    $('#lmsg').textContent=c==='auth/unauthorized-domain'?'โดเมนนี้ยังไม่ได้เพิ่มใน Authorized domains ('+location.hostname+')':c==='auth/operation-not-allowed'?'ยังไม่ได้เปิด Google ใน Authentication':'ล็อกอินไม่สำเร็จ: '+c})};
  $('#lo').onclick=function(){signOut(auth)};
  onAuthStateChanged(auth,function(u){
    if(unsub){unsub();unsub=null}
    if(!u){dbDoc=null;lg.className='';setSt(false);return}
    lg.className='hide';dbDoc=doc(db,'journals',u.uid);var first=true;
    unsub=onSnapshot(dbDoc,function(s){
      if(s.exists()){var d=s.data();if(d&&d.days&&!s.metadata.hasPendingWrites){S=d;try{localStorage.setItem('tj',JSON.stringify(S))}catch(e){}render()}setSt(!s.metadata.fromCache)}
      else if(first){setDoc(dbDoc,JSON.parse(JSON.stringify(S))).catch(function(){setSt(false)})}
      first=false;
    },function(){setSt(false)});
  });
}catch(e){lg.className='';$('#lmsg').textContent='เชื่อมต่อ Firebase ไม่สำเร็จ'}
</script>
</body>
</html>
